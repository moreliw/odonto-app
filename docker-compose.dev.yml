name: odonto-app-dev

services:
  postgres-master-dev:
    image: postgres:16-alpine
    container_name: postgres-master-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-master_dev}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - odonto-net-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-dev:
    image: redis:7-alpine
    container_name: redis-dev
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - odonto-net-dev

  minio-dev:
    image: quay.io/minio/minio:latest
    container_name: minio-dev
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      odonto-net-dev:
        aliases:
          - minio

  app-backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_ENV=development
      - PORT=3000
      - MASTER_DATABASE_URL=${MASTER_DATABASE_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_TO_FILE=${LOG_TO_FILE:-false}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - REDIS_URL=${REDIS_URL}
      - MASTER_ADMIN_TOKEN=${MASTER_ADMIN_TOKEN}
      - MASTER_SUPERADMIN_EMAIL=${MASTER_SUPERADMIN_EMAIL}
      - MASTER_SUPERADMIN_PASSWORD=${MASTER_SUPERADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_CONTENT_SID=${TWILIO_WHATSAPP_CONTENT_SID}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - PUBLIC_WILDCARD=${PUBLIC_WILDCARD}
      - ALLOW_FREE_SIGNUP=${ALLOW_FREE_SIGNUP:-true}
      - STRIPE_TRIAL_DAYS=${STRIPE_TRIAL_DAYS:-7}
      - STRIPE_EXPECTED_LIVEMODE=${STRIPE_EXPECTED_LIVEMODE:-false}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_BASIC_MONTHLY=${STRIPE_PRICE_BASIC_MONTHLY}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_CLINIC_MONTHLY=${STRIPE_PRICE_CLINIC_MONTHLY}
      - STRIPE_PRICE_BASIC_YEARLY=${STRIPE_PRICE_BASIC_YEARLY}
      - STRIPE_PRICE_PRO_YEARLY=${STRIPE_PRICE_PRO_YEARLY}
      - STRIPE_PRICE_CLINIC_YEARLY=${STRIPE_PRICE_CLINIC_YEARLY}
    depends_on:
      postgres-master-dev:
        condition: service_healthy
      redis-dev:
        condition: service_started
      minio-dev:
        condition: service_started
    volumes:
      - ./data/logs:/var/log
    networks:
      odonto-net-dev:
        aliases:
          - app-backend

  app-frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app-frontend-dev
    restart: unless-stopped
    depends_on:
      - app-backend-dev
    networks:
      - odonto-net-dev
    ports:
      - "${APP_HTTP_PORT:-8087}:8080"

networks:
  odonto-net-dev:
    driver: bridge
