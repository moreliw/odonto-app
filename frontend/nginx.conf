# Formato do log do beacon de métricas (ver "location = /e" abaixo). Precisa ficar
# no contexto http — este arquivo é incluído dentro dele, então fora do server {}.
#
# O IP real do visitante vem em X-Forwarded-For: o nginx do host acrescenta
# $remote_addr ao fim da lista, então o último elemento é o que ele de fato viu.
# É esse que o agregador usa, e não o começo, que o visitante poderia forjar
# mandando o próprio cabeçalho.
log_format odonto_beacon '$http_x_forwarded_for - - [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# ── Compressão ───────────────────────────────────────────────────────────────
# O padrão do nginx tem "gzip on" mas gzip_types só cobre text/html, e era por
# isso que o index.html chegava comprimido e o main.js (1,37 MB) não.
#
# Só compressão dinâmica aqui, de propósito. gzip_static (servir um .gz gerado
# no build) depende do módulo ngx_http_gzip_static_module, e não dá para
# confirmar que a imagem nginx:alpine traz; uma diretiva desconhecida derruba o
# "nginx -t" e trava a publicação. O ganho sobre o nível 6 dinâmico é de poucos
# por cento — não vale o risco sem verificar no servidor antes.
#
# Brotli renderia ~15% a mais, mas exige ngx_brotli, que também não vem na
# imagem — precisaria compilar uma própria. Ambos ficam anotados como próximo
# passo, depois de rodar "nginx -V" no servidor.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  application/javascript
  text/javascript
  application/json
  application/manifest+json
  application/xml
  text/css
  text/plain
  text/xml
  image/svg+xml;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 25m;
  # Atrás do nginx do host, este container só conhece a própria porta: um
  # redirecionamento absoluto sai como http://dominio:8080/... e leva o
  # visitante para um endereço que não existe de fora. Location relativo
  # resolve para qualquer redirecionamento gerado aqui.
  absolute_redirect off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Os bundles agora saem do build com hash no nome (outputHashing: all), então
  # um arquivo com hash nunca muda de conteúdo e pode ser guardado para sempre.
  # Antes, sem hash, era preciso "no-cache" em todo JS/CSS para o navegador não
  # ficar preso em código antigo depois de um deploy.
  location ~* \.[0-9a-f]{8,}\.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Resto do JS/CSS (sem hash): revalida sempre, pelo ETag.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # O index.html aponta para os bundles com hash, então ele é o único arquivo
  # que precisa ser sempre reconferido — é o que faz o deploy novo ser visto.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Imagens e ícones mudam pouco e não têm hash no nome: uma semana com
  # revalidação em segundo plano evita rebaixar a primeira pintura.
  location ~* \.(png|jpe?g|gif|svg|ico|webp|avif)$ {
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  # Link curto usado nas mensagens. O backend entrega metadados Open Graph da
  # clínica e redireciona o paciente para a tela Angular de confirmação.
  location /c/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://app-backend:3000/api/public/appointments/share/;
  }

  # Métricas próprias do site (src/app/services/analytics.service.ts): o beacon
  # vira só uma linha neste log, lida pelo painel. Sem cookies, sem backend e
  # sem nada gravado no banco das clínicas.
  location = /e {
    access_log /var/log/nginx/odonto/analytics.log odonto_beacon;
    add_header Cache-Control "no-store" always;
    return 204;
  }

  # Painel privado de acessos (deploy/painel), protegido por senha. O conteúdo
  # é montado do host, onde o cron recalcula o stats.json a cada 5 minutos.
  location = /painel {
    return 301 /painel/;
  }

  location ^~ /painel/ {
    alias /var/www/painel/;
    index index.html;
    auth_basic "Painel OdontoApp";
    # Diretório montado, não arquivo: um bind-mount de arquivo inexistente vira
    # uma pasta e derruba o nginx inteiro. Faltando o htpasswd, só /painel/
    # responde 500 — ninguém entra sem senha e o site segue no ar.
    auth_basic_user_file /etc/nginx/painel/htpasswd;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_pass http://app-backend:3000/api;
  }

  # Uploads assinados permanecem no mesmo domínio HTTPS do aplicativo. Isso
  # evita mixed-content no navegador e mantém o MinIO isolado na rede Docker.
  location ~ ^/(odonto-files|odonto-files-dev)/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://minio:9000;
  }
}
